name: CI - Skills Verification & Evals

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest pytest-asyncio

      - name: Run Skills Schema & Quality Gate Tests
        run: |
          pytest tests/test_skills_schema.py -v

      - name: Run Skills Script Integration Tests
        run: |
          pytest tests/test_skill_scripts.py -v

      - name: Run Skills Evals Benchmark Suite
        run: |
          python evals/run_evals.py
