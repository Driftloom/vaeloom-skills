name: CI - Skills Verification & Evals

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest pytest-asyncio

      - name: Run Skills Schema & Quality Gate Tests
        run: |
          pytest tests/test_skills_schema.py -v

      - name: Run Skills Script Integration Tests
        run: |
          pytest tests/test_skill_scripts.py -v

      - name: Run LinkedIn Tool Tests
        run: |
          pytest tests/test_linkedin_tools.py -v

      - name: Check catalog contract is self-consistent
        run: |
          pytest tests/test_catalog_contract.py -v

      - name: Run Skill Scorecard Tests
        run: |
          pytest tests/test_score_skills.py -v

      - name: Run Eval Suite Integrity Tests
        run: |
          pytest tests/test_eval_suite_integrity.py -v

      - name: Run Layer 3 Judging Harness Tests
        run: |
          pytest tests/test_layer3_judge.py -v

      - name: Run Layer 3 Variance Analyser Tests
        # Guards the rule that a judged number is only a result if it exceeds
        # judge noise. The analyser has shipped two inverted answers already.
        run: |
          pytest tests/test_layer3_variance.py -v

      - name: Run Layer 3 staleness guard tests
        # A report that does not record the rubric it was scored against cannot
        # be compared against one scored under a different rubric. That mistake
        # produced a false 0.00 agreement figure for `agency`.
        run: |
          pytest tests/test_layer3_staleness_guard.py -v

      - name: Pin the anti-fabrication decision rules in the resume skills
        # These rules are the fix for a measured defect: 25.0% of generations
        # invented a figure the source never contained because the documents
        # demanded a metric without saying what to do when none was available.
        # A removed rule is silent, so it is asserted rather than left to review.
        run: |
          pytest tests/test_resume_skill_fabrication_guard.py -v

      - name: Verify the Layer 3 harness executes end to end (synthetic)
        # Proves the generation -> evidence -> judge -> aggregate path runs.
        # The stub backend is deterministic and free, and its output is labelled
        # SYNTHETIC; this step verifies plumbing and makes no quality claim.
        # Live judging needs credentials and is run separately.
        run: |
          python evals/layer3_judge.py --backend stub --split held_out --seeds 3

      - name: Verify the variance analyser runs against the shipped live reports
        # The live reports are committed, so the signal-vs-noise conclusions in
        # docs/layer3-judging.md must stay reproducible. This asserts the
        # analyser runs and still finds the ordering supported; it makes no new
        # quality claim and spends nothing.
        run: |
          python evals/layer3_variance.py layer3-live-s3.json --compare layer3-live-report.json

      - name: Verify the Layer 3 documentation still matches the measurements
        # A doc that quotes numbers nothing checks is the same defect one level
        # up from the analyser. This already caught a stale 1-seed mean and a
        # per-generation rate rounded away from the analyser's own output.
        run: |
          python scripts/check_doc_figures.py

      - name: Re-run the inter-judge comparison against the committed result
        # Cross-model agreement is the harder calibration test and needs the
        # second provider's credentials, so it does not run in CI. What CI can
        # do is assert the committed agreement data still holds and that the
        # weakest criterion is still reported, so the calibration gap stays
        # visible rather than being quietly forgotten.
        run: |
          python -c "
          import json, sys
          d = json.load(open('layer3-interjudge.json', encoding='utf-8'))
          assert d['worst_delta'] <= 10, d['worst_delta']
          assert d['weakest_criterion'] in d['per_criterion_mean_delta']
          print('weakest criterion:', d['weakest_criterion'],
                  d['per_criterion_mean_delta'][d['weakest_criterion']])
          print('NOTE: agreement is', d['exact_agreement_pct'], 'percent;',
                  'agency anchors remain the open calibration gap')
          "

      - name: Run Skills Evals Benchmark Suite
        run: |
          python evals/run_evals.py

      - name: Verify the skill scorecard floor has not regressed
        # Ratchet, not aspiration. The measured floor is 45.0; the weakest skill
        # currently scores 45.4 and the mean is 58.1. This step forbids the
        # catalogue from getting worse. Raising it is a deliberate act, paired
        # with an actual improvement to a skill -- see
        # docs/skill-scorecard.md.
        run: |
          python scripts/score_skills.py --min-score 45.0 --quiet
