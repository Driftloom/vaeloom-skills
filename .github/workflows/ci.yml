name: CI - Skills Verification & Evals

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  validate-and-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest pytest-asyncio

      - name: Run Skills Schema & Quality Gate Tests
        run: |
          pytest tests/test_skills_schema.py -v

      - name: Run Skills Script Integration Tests
        run: |
          pytest tests/test_skill_scripts.py -v

      - name: Run LinkedIn Tool Tests
        run: |
          pytest tests/test_linkedin_tools.py -v

      - name: Check catalog contract is self-consistent
        run: |
          pytest tests/test_catalog_contract.py -v

      - name: Run Skill Scorecard Tests
        run: |
          pytest tests/test_score_skills.py -v

      - name: Run Eval Suite Integrity Tests
        run: |
          pytest tests/test_eval_suite_integrity.py -v

      - name: Run Layer 3 Judging Harness Tests
        run: |
          pytest tests/test_layer3_judge.py -v

      - name: Verify the Layer 3 harness executes end to end (synthetic)
        # Proves the generation -> evidence -> judge -> aggregate path runs.
        # The stub backend is deterministic and free, and its output is labelled
        # SYNTHETIC; this step verifies plumbing and makes no quality claim.
        # Live judging needs credentials and is run separately.
        run: |
          python evals/layer3_judge.py --backend stub --split held_out --seeds 3

      - name: Run Skills Evals Benchmark Suite
        run: |
          python evals/run_evals.py

      - name: Verify the skill scorecard floor has not regressed
        # Ratchet, not aspiration. The measured floor is 45.0; the weakest skill
        # currently scores 45.4 and the mean is 58.1. This step forbids the
        # catalogue from getting worse. Raising it is a deliberate act, paired
        # with an actual improvement to a skill -- see
        # docs/skill-scorecard.md.
        run: |
          python scripts/score_skills.py --min-score 45.0 --quiet
